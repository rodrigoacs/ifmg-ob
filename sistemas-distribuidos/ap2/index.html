<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Usuários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header style="text-align: center; margin-bottom: 30px">
      <h1>Dashboard de Usuários</h1>
    </header>

    <main class="container">
      <div class="card">
        <h2><i class="fas fa-user-edit"></i> Adicionar / Atualizar</h2>
        <form id="form-adicionar-atualizar">
          <div class="form-group">
            <label for="userName">Nome:</label>
            <input type="text" id="userName" placeholder="Nome completo" required />
          </div>
          <div class="form-group">
            <label for="userEmail">Email:</label>
            <input type="email" id="userEmail" placeholder="email@exemplo.com" required />
          </div>
          <div class="button-group">
            <button type="button" id="btnAdicionar" class="btn btn-primary">
              <i class="fas fa-plus"></i> Adicionar
            </button>
            <button type="button" id="btnAtualizar" class="btn btn-primary">
              <i class="fas fa-save"></i> Atualizar
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2><i class="fas fa-search"></i> Consultar / Remover</h2>
        <form id="form-consultar-remover">
          <div class="form-group">
            <label for="queryName">Nome:</label>
            <input type="text" id="queryName" placeholder="Digite o nome do usuário" required />
          </div>
          <div class="button-group">
            <button type="button" id="btnConsultar" class="btn btn-primary">
              <i class="fas fa-search"></i> Consultar
            </button>
            <button type="button" id="btnRemover" class="btn btn-danger">
              <i class="fas fa-trash"></i> Remover
            </button>
          </div>
        </form>
      </div>

      <div class="card full-width">
        <h2><i class="fas fa-users"></i> Todos os Usuários</h2>
        <button
          id="btnListarTodos"
          class="btn btn-primary"
          style="width: auto; margin-bottom: 20px"
        >
          <i class="fas fa-sync-alt"></i> Listar Todos
        </button>
        <div class="table-container" style="overflow-x: auto">
          <table id="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="user-list-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card full-width">
        <h2><i class="fas fa-file-alt"></i> Log de Respostas</h2>
        <pre
          id="response-log"
          style="
            background-color: #212529;
            color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
          "
        ></pre>
      </div>
    </main>

    <div id="toast-container"></div>
  </body>
  <script src="script.js"></script>
</html>
