<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Usuários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      /* CSS Variables for easy theming */
      :root {
        --primary-color: #0d6efd;
        --primary-hover: #0b5ed7;
        --danger-color: #dc3545;
        --danger-hover: #bb2d3b;
        --success-color: #198754;
        --bg-color: #f8f9fa;
        --card-bg-color: #ffffff;
        --text-color: #212529;
        --light-gray: #dee2e6;
        --border-radius: 8px;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 25px;
      }

      /* Responsive Grid Layout for larger screens */
      @media (min-width: 800px) {
        .container {
          grid-template-columns: 1fr 1fr;
        }
        .card.full-width {
          grid-column: 1 / -1;
        }
      }

      .card {
        background-color: var(--card-bg-color);
        border-radius: var(--border-radius);
        padding: 25px;
        box-shadow: var(--shadow);
        transition: transform 0.2s ease-in-out;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card h2 {
        margin-bottom: 20px;
        font-weight: 600;
        color: var(--primary-color);
        border-bottom: 2px solid var(--light-gray);
        padding-bottom: 10px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--light-gray);
        border-radius: 6px;
        font-size: 16px;
        font-family: 'Poppins', sans-serif;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
      }

      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--primary-color);
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--primary-hover);
      }

      .btn-danger {
        background-color: var(--danger-color);
      }
      .btn-danger:hover:not(:disabled) {
        background-color: var(--danger-hover);
      }

      .button-group {
        display: flex;
        gap: 10px;
      }

      /* Toast Notifications */
      #toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        padding: 15px 20px;
        border-radius: var(--border-radius);
        color: white;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateX(100%);
        animation: slideIn 0.5s forwards;
      }

      .toast.success {
        background-color: var(--success-color);
      }
      .toast.error {
        background-color: var(--danger-color);
      }

      @keyframes slideIn {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Loader Spinner */
      .loader {
        width: 18px;
        height: 18px;
        border: 2px solid #fff;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        animation: rotation 1s linear infinite;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Table Styles */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid var(--light-gray);
      }
      th {
        background-color: var(--bg-color);
        font-weight: 600;
      }
      tbody tr:hover {
        background-color: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <header style="text-align: center; margin-bottom: 30px">
      <h1>Dashboard de Usuários</h1>
    </header>

    <main class="container">
      <div class="card">
        <h2><i class="fas fa-user-edit"></i> Adicionar / Atualizar</h2>
        <form id="form-adicionar-atualizar">
          <div class="form-group">
            <label for="userName">Nome:</label>
            <input type="text" id="userName" placeholder="Nome completo" required />
          </div>
          <div class="form-group">
            <label for="userEmail">Email:</label>
            <input type="email" id="userEmail" placeholder="email@exemplo.com" required />
          </div>
          <div class="button-group">
            <button type="button" id="btnAdicionar" class="btn btn-primary">
              <i class="fas fa-plus"></i> Adicionar
            </button>
            <button type="button" id="btnAtualizar" class="btn btn-primary">
              <i class="fas fa-save"></i> Atualizar
            </button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2><i class="fas fa-search"></i> Consultar / Remover</h2>
        <form id="form-consultar-remover">
          <div class="form-group">
            <label for="queryName">Nome:</label>
            <input type="text" id="queryName" placeholder="Digite o nome do usuário" required />
          </div>
          <div class="button-group">
            <button type="button" id="btnConsultar" class="btn btn-primary">
              <i class="fas fa-search"></i> Consultar
            </button>
            <button type="button" id="btnRemover" class="btn btn-danger">
              <i class="fas fa-trash"></i> Remover
            </button>
          </div>
        </form>
      </div>

      <div class="card full-width">
        <h2><i class="fas fa-users"></i> Todos os Usuários</h2>
        <button
          id="btnListarTodos"
          class="btn btn-primary"
          style="width: auto; margin-bottom: 20px"
        >
          <i class="fas fa-sync-alt"></i> Listar Todos
        </button>
        <div class="table-container" style="overflow-x: auto">
          <table id="user-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="user-list-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card full-width">
        <h2><i class="fas fa-file-alt"></i> Log de Respostas</h2>
        <pre
          id="response-log"
          style="
            background-color: #212529;
            color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
          "
        ></pre>
      </div>
    </main>

    <div id="toast-container"></div>

    <script>
      const API_URL = 'http://127.0.0.1:5000/'
      const logDiv = document.getElementById('response-log')

      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container')
        const toast = document.createElement('div')
        toast.className = `toast ${type}`
        toast.textContent = message
        container.appendChild(toast)

        setTimeout(() => {
          toast.style.animation = 'slideOut 0.5s forwards'
          toast.addEventListener('animationend', () => toast.remove())
        }, 3000)
      }

      function logResponse(data, status) {
        const timestamp = new Date().toLocaleTimeString()
        const statusText = status >= 200 && status < 300 ? 'SUCCESS' : 'ERROR'
        logDiv.textContent =
          `[${timestamp}] - ${statusText} (${status})\n\n` + JSON.stringify(data, null, 2)
      }

      function setLoading(button, isLoading) {
        if (isLoading) {
          button.disabled = true
          button.dataset.originalHtml = button.innerHTML
          button.innerHTML = '<span class="loader"></span> Carregando...'
        } else {
          button.disabled = false
          button.innerHTML = button.dataset.originalHtml
        }
      }

      async function handleRequest(url, options, button) {
        setLoading(button, true)
        try {
          const response = await fetch(url, options)
          const data = await response.json()

          logResponse(data, response.status)

          if (!response.ok) {
            throw new Error(data.error || 'Ocorreu um erro na requisição.')
          }

          showToast('Operação realizada com sucesso!', 'success')
          return data
        } catch (error) {
          showToast(error.message, 'error')
          logResponse({ error: error.message }, 500)
        } finally {
          setLoading(button, false)
        }
      }

      const btnAdicionar = document.getElementById('btnAdicionar')
      btnAdicionar.addEventListener('click', () => {
        const name = document.getElementById('userName').value
        const email = document.getElementById('userEmail').value
        if (!name || !email) return showToast('Nome e Email são obrigatórios!', 'error')

        const options = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        }
        handleRequest(API_URL, options, btnAdicionar)
      })

      const btnAtualizar = document.getElementById('btnAtualizar')
      btnAtualizar.addEventListener('click', () => {
        const name = document.getElementById('userName').value
        const email = document.getElementById('userEmail').value
        if (!name || !email) return showToast('Nome e Email são obrigatórios!', 'error')

        const options = {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        }
        handleRequest(API_URL, options, btnAtualizar)
      })

      const btnConsultar = document.getElementById('btnConsultar')
      btnConsultar.addEventListener('click', () => {
        const name = document.getElementById('queryName').value
        if (!name) return showToast('O nome é obrigatório para consulta!', 'error')
        const options = { method: 'GET' }
        handleRequest(`${API_URL}?name=${encodeURIComponent(name)}`, options, btnConsultar)
      })

      const btnRemover = document.getElementById('btnRemover')
      btnRemover.addEventListener('click', () => {
        const name = document.getElementById('queryName').value
        if (!name) return showToast('O nome é obrigatório para remoção!', 'error')
        const options = {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        }
        handleRequest(API_URL, options, btnRemover)
      })

      const btnListarTodos = document.getElementById('btnListarTodos')
      const userListBody = document.getElementById('user-list-body')

      btnListarTodos.addEventListener('click', async () => {
        setLoading(btnListarTodos, true)
        try {
          const response = await fetch(`${API_URL}users`)
          const users = await response.json()

          userListBody.innerHTML = ''

          if (users.length === 0) {
            const row = `<tr><td colspan="3" style="text-align: center;">Nenhum usuário encontrado.</td></tr>`
            userListBody.innerHTML = row
          } else {
            users.forEach(user => {
              const row = `
                            <tr>
                                <td>${user._id}</td>
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                            </tr>
                        `
              userListBody.innerHTML += row
            })
          }
          showToast('Lista de usuários atualizada!', 'success')
        } catch (error) {
          showToast('Falha ao buscar usuários.', 'error')
          userListBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: red;">Erro ao carregar dados.</td></tr>`
        } finally {
          setLoading(btnListarTodos, false)
        }
      })
    </script>
  </body>
</html>
